<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor de Catálogo — Prometheus Elegance</title>
    <link rel="icon" href="../assets/images/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/site.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <style>
      body {
        margin: 0;
        background: #f7f1ea;
        color: #1f1f1f;
      }

      .editor-shell h1,
      .editor-shell h3,
      .editor-shell h4 {
        color: #174a78;
      }

      .editor-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .editor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .brand-button {
        border: none;
        border-radius: 999px;
        padding: 11px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .brand-button:hover {
        transform: translateY(-1px);
      }

      .brand-button-gold {
        background: linear-gradient(135deg, #dec17d, #b98a2f);
        color: #1e1403;
      }

      .brand-button-outline {
        background: rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(26, 25, 24, 0.15);
        color: #1f1f1f;
      }

      .editor-layout {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        gap: 18px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(31, 31, 31, 0.08);
        border-radius: 18px;
        box-shadow: 0 10px 26px rgba(23, 18, 10, 0.05);
      }

      .editor-form-panel,
      .editor-list-panel {
        padding: 18px;
      }

      .editor-form-panel h3,
      .editor-list-panel h3 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }

      .editor-form {
        display: grid;
        gap: 14px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .form-group {
        display: grid;
        gap: 8px;
      }

      .form-group label {
        font-weight: 700;
        font-size: 0.9rem;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 11px 12px;
        border-radius: 12px;
        border: 1px solid rgba(31, 31, 31, 0.18);
        font: inherit;
        background: #fff;
      }

      .editor-form input,
      .editor-form select,
      .editor-form textarea,
      .editor-form select option {
        color: #174a78;
      }

      .editor-form input::placeholder,
      .editor-form textarea::placeholder {
        color: #68798a;
        opacity: 1;
      }

      .preview-box {
        display: none;
        border: 1px solid rgba(31, 31, 31, 0.12);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }

      .preview-box img {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .editor-list {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .catalog-card {
        display: grid;
        grid-template-columns: 88px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px;
        border: 1px solid rgba(31, 31, 31, 0.08);
        background: #fff;
        border-radius: 12px;
      }

      .catalog-thumb {
        width: 88px;
        height: 88px;
        border-radius: 10px;
        overflow: hidden;
        background: #f1ede8;
      }

      .catalog-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .catalog-copy {
        min-width: 0;
      }

      .catalog-copy h4 {
        margin: 0 0 4px;
        font-size: 1rem;
      }

      .catalog-copy p {
        margin: 0;
        color: #544d43;
        font-size: 0.84rem;
      }

      .catalog-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .mini-btn {
        border: none;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
      }

      .mini-btn.edit {
        background: #efe6d1;
        color: #31240a;
      }

      .mini-btn.delete {
        background: #f4d9d9;
        color: #4a1919;
      }

      .empty-state {
        padding: 18px;
        text-align: center;
        background: #fff;
        border: 1px dashed rgba(31, 31, 31, 0.2);
        border-radius: 12px;
      }

      #editor-status {
        min-height: 1.5em;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.75);
      }

      .online-access {
        display: none;
        margin-bottom: 18px;
        padding: 18px;
      }

      .online-access h2 {
        margin: 0 0 6px;
        color: #174a78;
        font-size: 1.2rem;
      }

      .online-access p {
        margin: 0 0 12px;
      }

      .online-login-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
        align-items: end;
        gap: 12px;
      }

      .online-login-form .form-group {
        display: grid;
        gap: 8px;
      }

      .online-login-form [hidden],
      .editor-actions [hidden] {
        display: none !important;
      }

      .online-login-form label {
        color: #174a78;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .online-login-form input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid rgba(31, 31, 31, 0.18);
        border-radius: 12px;
        background: #fff;
        color: #174a78;
        font: inherit;
      }

      .online-login-form input::placeholder {
        color: #68798a;
        opacity: 1;
      }

      @media (max-width: 620px) {
        .online-login-form {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 860px) {
        .editor-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 520px) {
        .catalog-card {
          grid-template-columns: 64px minmax(0, 1fr);
        }

        .catalog-thumb {
          width: 64px;
          height: 64px;
        }

        .catalog-actions {
          grid-column: 1 / -1;
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div class="editor-shell">
      <header class="editor-header">
        <div>
          <p class="eyebrow">Editor rápido</p>
          <h1>Catálogo da loja</h1>
        </div>

        <div class="editor-actions">
          <a id="view-store-link" href="../index.html" target="_blank" rel="noopener" class="brand-button brand-button-outline">Ver loja</a>
          <button id="new-product-btn" type="button" class="brand-button brand-button-outline">Adicionar roupa</button>
        </div>
      </header>

      <section id="online-access-panel" class="panel online-access" aria-labelledby="online-access-title">
        <h2 id="online-access-title">Publicar na loja online</h2>
        <p id="online-access-description">Entre com o mesmo usuário e senha do painel administrativo para salvar direto na loja.</p>
        <form id="online-login-form" class="online-login-form">
          <div class="form-group">
            <label for="online-username">Usuário do admin</label>
            <input id="online-username" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="online-password">Senha do admin</label>
            <input id="online-password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div class="editor-actions">
            <button id="online-login-button" type="submit" class="brand-button brand-button-gold">Entrar</button>
            <button id="online-logout-button" type="button" class="brand-button brand-button-outline" hidden>Sair</button>
          </div>
        </form>
      </section>

      <p id="editor-status" role="status" aria-live="polite">Carregando produtos...</p>

      <div class="editor-layout">
        <section class="panel editor-form-panel">
          <h3>Dados do produto</h3>

          <form id="product-form" class="editor-form">
            <input type="hidden" id="product-id" />

            <div class="form-group">
              <label for="product-name">Nome</label>
              <input id="product-name" type="text" placeholder="Ex: Camiseta Dry-Fit" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="product-category">Categoria</label>
                <select id="product-category" required>
                  <option value="Camisetas esportivas">Camisetas esportivas</option>
                  <option value="Shorts e bermudas">Shorts e bermudas</option>
                  <option value="Conjuntos e agasalhos">Conjuntos e agasalhos</option>
                  <option value="Fitness: tops, shorts e legging">Fitness: tops, shorts e legging</option>
                  <option value="Tênis">Tênis</option>
                  <option value="Bonés, garrafas e acessórios">Bonés, garrafas e acessórios</option>
                </select>
              </div>

              <div class="form-group">
                <label for="product-price">Preço (R$)</label>
                <input id="product-price" type="number" step="0.01" min="0" placeholder="89.90" required />
              </div>
            </div>

            <div class="form-group">
              <label for="product-description">Descrição</label>
              <textarea id="product-description" rows="4" placeholder="Escreva as características do produto"></textarea>
            </div>

            <div class="form-group">
              <label for="product-image">Imagem</label>
              <input id="product-image" type="text" placeholder="https://... ou ./assets/images/..." />
              <label for="product-image-file">Ou escolha uma foto do celular/computador</label>
              <input id="product-image-file" type="file" accept="image/*" />
            </div>

            <div id="preview-box" class="preview-box">
              <img id="product-image-preview" src="" alt="Prévia da imagem" />
            </div>

            <div class="editor-actions">
              <button id="product-save-btn" type="submit" class="brand-button brand-button-gold">Salvar produto</button>
              <button type="button" id="cancel-edit-btn" class="brand-button brand-button-outline">Cancelar</button>
            </div>
          </form>
        </section>

        <section class="panel editor-list-panel">
          <h3>Produtos cadastrados</h3>
          <div id="catalog-list" class="editor-list"></div>
        </section>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
